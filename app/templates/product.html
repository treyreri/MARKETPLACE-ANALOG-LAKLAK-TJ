{% extends "base.html" %}

{% block content %}
<section class="container section" data-product-page data-product-id="{{ product_id }}">
  <div class="product-page" hidden>
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="/" data-i18n="nav.home">Home</a>
      <span aria-hidden="true">/</span>
      <a data-field="category-link"></a>
    </nav>
    <div class="product-layout">
      <div class="product-gallery product-media" data-field="media"></div>
      <div class="product-info">
        <p class="product-category" data-field="category"></p>
        <h1 data-field="name"></h1>
        <p class="product-page-price" data-field="price"></p>
        <dl class="product-facts">
          <div><dt data-i18n="product.seller">Seller</dt><dd data-field="seller"></dd></div>
          <div data-field="brand-row"><dt data-i18n="product.brand">Brand</dt><dd data-field="brand"></dd></div>
          <div><dt data-i18n="product.stock">In stock</dt><dd data-field="stock"></dd></div>
        </dl>

        <div class="buy-box">
          <div class="qty" role="group" data-i18n-aria="product.quantity">
            <button type="button" class="qty-btn" data-qty="-1" aria-label="-">−</button>
            <input class="qty-input" type="number" inputmode="numeric" min="1" value="1" data-i18n-aria="product.quantity">
            <button type="button" class="qty-btn" data-qty="1" aria-label="+">+</button>
          </div>
          <button type="button" class="btn btn-primary" data-action="add" data-i18n="product.add_to_cart">Add to cart</button>
          <button type="button" class="btn btn-secondary" data-action="buy" data-i18n="product.buy_now">Buy now</button>
        </div>

        <h2 class="h3" data-i18n="product.description">Description</h2>
        <p class="product-page-description" data-field="description"></p>
      </div>
    </div>
  </div>
  <div data-state></div>
</section>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/product.js"></script>
{% endblock %}
